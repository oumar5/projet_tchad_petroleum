[project]
name = "smartbarrel"
version = "3.0.0-dev"
description = "SmartBarrel — Plateforme microservices d'optimisation pétrolière"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "T20", "RET", "SIM"]
ignore = ["S101", "S104"]

[tool.pytest.ini_options]
testpaths = ["services/*/tests", "shared/tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "integration: integration tests requiring external services",
    "slow: slow tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
