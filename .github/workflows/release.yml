name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Cible"
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service:
          - auth_service
          - production_service
          - maintenance_service
          - ml_service
          - etl_service
          - notification_service
          - docs_aggregator
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartbarrel-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smartbarrel-${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
      - name: Apply manifests
        run: |
          kubectl -n smartbarrel apply -f backend/infra/k8s/
          kubectl -n smartbarrel set image deployment/auth-service auth=ghcr.io/${{ github.repository_owner }}/smartbarrel-auth_service:${{ github.sha }}
          kubectl -n smartbarrel set image deployment/production-service production=ghcr.io/${{ github.repository_owner }}/smartbarrel-production_service:${{ github.sha }}
          kubectl -n smartbarrel set image deployment/maintenance-service maintenance=ghcr.io/${{ github.repository_owner }}/smartbarrel-maintenance_service:${{ github.sha }}
          kubectl -n smartbarrel set image deployment/ml-service ml=ghcr.io/${{ github.repository_owner }}/smartbarrel-ml_service:${{ github.sha }}
          kubectl -n smartbarrel set image deployment/etl-service etl=ghcr.io/${{ github.repository_owner }}/smartbarrel-etl_service:${{ github.sha }}
          kubectl -n smartbarrel set image deployment/notification-service notif=ghcr.io/${{ github.repository_owner }}/smartbarrel-notification_service:${{ github.sha }}
          kubectl -n smartbarrel rollout status deployment --timeout=10m
