name: Build & Push on Change

on:
  push:
    branches: [main]
    paths:
      - "backend/services/**"
      - "backend/shared/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build (leave empty for all)"
        required: false
        type: choice
        options:
          - all
          - auth_service
          - production_service
          - maintenance_service
          - ml_service
          - etl_service
          - notification_service
          - docs_aggregator

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changes
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          SERVICES=()

          if echo "$CHANGED_FILES" | grep -qE "^backend/shared/"; then
            SERVICES=("auth_service" "production_service" "maintenance_service" "ml_service" "etl_service" "notification_service" "docs_aggregator")
          else
            for svc in auth_service production_service maintenance_service ml_service etl_service notification_service docs_aggregator; do
              if echo "$CHANGED_FILES" | grep -q "^backend/services/$svc/"; then
                SERVICES+=("$svc")
              fi
            done
          fi

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -sc .)
            echo "services=$JSON" >> "$GITHUB_OUTPUT"
          fi

  build-on-push:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartbarrel-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smartbarrel-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-manual:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        service: ${{ inputs.service == 'all' && fromJson('["auth_service","production_service","maintenance_service","ml_service","etl_service","notification_service","docs_aggregator"]') || fromJson(format('["{0}"]', inputs.service)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartbarrel-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smartbarrel-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
