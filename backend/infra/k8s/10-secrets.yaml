# Template — generate the real secret with kubectl create secret generic ...
# from --from-literal flags or sealed-secrets / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: smartbarrel-env
  namespace: smartbarrel
type: Opaque
stringData:
  POSTGRES_USER: smartbarrel
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: smartbarrel_db
  RABBITMQ_DEFAULT_USER: smartbarrel
  RABBITMQ_DEFAULT_PASS: REPLACE_ME
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://smartbarrel:REPLACE_ME@rabbitmq:5672/
  JWT_PUBLIC_KEY_PATH: /etc/jwt/public.pem
  JWT_PRIVATE_KEY_PATH: /etc/jwt/private.pem
  JWT_ALGORITHM: RS256
  JWT_ISSUER: smartbarrel-auth
  JWT_ACCESS_TTL_SECONDS: "900"
  JWT_REFRESH_TTL_SECONDS: "604800"
---
apiVersion: v1
kind: Secret
metadata:
  name: smartbarrel-jwt-keys
  namespace: smartbarrel
type: Opaque
data:
  # base64 of pem files — cf. infra/scripts/k8s-bootstrap.sh
  public.pem: ""
  private.pem: ""
