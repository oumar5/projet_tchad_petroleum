apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: smartbarrel
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 50Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: smartbarrel
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: smartbarrel-env } }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: [pg_isready, -U, smartbarrel] }
            periodSeconds: 10
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: postgres-data } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: smartbarrel }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
