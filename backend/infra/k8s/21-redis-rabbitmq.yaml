apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: smartbarrel }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: smartbarrel }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: smartbarrel }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - { containerPort: 5672 }
            - { containerPort: 15672 }
          envFrom: [{ secretRef: { name: smartbarrel-env } }]
          readinessProbe:
            exec: { command: [rabbitmq-diagnostics, ping] }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: smartbarrel }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: mgmt, port: 15672, targetPort: 15672 }
