kind: Deployment
metadata: { name: production-service, namespace: smartbarrel }
spec:
  replicas: 2
  selector: { matchLabels: { app: production-service, role: jwt-validator } }
  template:
    metadata: { labels: { app: production-service, role: jwt-validator } }
    spec:
      containers:
        - name: production
          image: smartbarrel/production-service:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: smartbarrel-env } }]
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          volumeMounts:
            - { name: jwt, mountPath: /etc/jwt, readOnly: true }
          readinessProbe: { httpGet: { path: /health, port: 8000 } }
      volumes:
        - { name: jwt, secret: { secretName: smartbarrel-jwt-keys } }
---
apiVersion: v1
kind: Service
metadata: { name: production-service, namespace: smartbarrel }
spec:
  selector: { app: production-service }
  ports: [{ port: 8000 }]
---
