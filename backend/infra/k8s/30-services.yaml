apiVersion: apps/v1
kind: Deployment
metadata: { name: ml-service, namespace: smartbarrel }
spec:
  replicas: 2
  selector: { matchLabels: { app: ml-service, role: jwt-validator } }
  template:
    metadata: { labels: { app: ml-service, role: jwt-validator } }
    spec:
      containers:
        - name: ml
          image: smartbarrel/ml-service:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: smartbarrel-env } }]
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          volumeMounts:
            - { name: jwt, mountPath: /etc/jwt, readOnly: true }
            - { name: models, mountPath: /app/models }
          readinessProbe: { httpGet: { path: /health, port: 8000 } }
      volumes:
        - { name: jwt, secret: { secretName: smartbarrel-jwt-keys } }
        - { name: models, persistentVolumeClaim: { claimName: ml-models } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ml-models, namespace: smartbarrel }
spec:
  accessModes: [ReadWriteMany]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: ml-service, namespace: smartbarrel }
spec:
  selector: { app: ml-service }
  ports: [{ port: 8000 }]
---
