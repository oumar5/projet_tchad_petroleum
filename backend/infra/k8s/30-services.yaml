# Generic deployment template for all 7 microservices.
# DATABASE_URL is composed from POSTGRES_* secrets at runtime via shared env.

apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: smartbarrel }
spec:
  replicas: 2
  selector: { matchLabels: { app: auth-service, role: jwt-validator } }
  template:
    metadata: { labels: { app: auth-service, role: jwt-validator } }
    spec:
      containers:
        - name: auth
          image: smartbarrel/auth-service:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: smartbarrel-env } }]
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          volumeMounts:
            - { name: jwt, mountPath: /etc/jwt, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
      volumes:
        - { name: jwt, secret: { secretName: smartbarrel-jwt-keys } }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: smartbarrel }
spec:
  selector: { app: auth-service }
  ports: [{ port: 8000 }]
---
# Repeat the same shape for the other services. To save space the spec uses
# the same envFrom + volume mounts. Swap the image and labels per service.
