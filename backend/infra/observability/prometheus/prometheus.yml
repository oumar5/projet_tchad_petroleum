global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: smartbarrel
    static_configs:
      - targets:
          - auth-service:8000
          - production-service:8000
          - maintenance-service:8000
          - ml-service:8000
          - etl-service:8000
          - notification-service:8000
          - docs-aggregator:8000
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
