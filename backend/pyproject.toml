[project]
name = "smartbarrel"
version = "3.0.0-dev"
description = "SmartBarrel — Plateforme microservices d'optimisation pétrolière"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "RET", "SIM"]
# E501 — line length warnings
# B008 — function default arg with call (FastAPI Depends() pattern)
# B904 — raise from / raise ... use of "from"
# C401/C408 — comprehensions / dict() vs {} (cosmetic)
# RET504/RET505 — early return cosmetic
# SIM117 — nested with collapses
ignore = ["E501", "B008", "B904", "C401", "C408", "RET504", "RET505", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["services/*/tests", "shared/tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "integration: integration tests requiring external services",
    "slow: slow tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
