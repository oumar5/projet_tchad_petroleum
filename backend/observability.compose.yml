name: smartbarrel-observability

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: smartbarrel-prometheus
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports: ["9090:9090"]
    networks: [smartbarrel-net]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: smartbarrel-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, loki]
    networks: [smartbarrel-net]

  loki:
    image: grafana/loki:3.2.1
    container_name: smartbarrel-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports: ["3100:3100"]
    networks: [smartbarrel-net]

  promtail:
    image: grafana/promtail:3.2.1
    container_name: smartbarrel-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [smartbarrel-net]

  tempo:
    image: grafana/tempo:2.6.1
    container_name: smartbarrel-tempo
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports: ["3200:3200", "4318:4318"]
    networks: [smartbarrel-net]

volumes:
  prom_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  smartbarrel-net:
    external: true
